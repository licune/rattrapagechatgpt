<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Carrefour — Darwin</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f3f6fb;
padding:20px;
}

.panel{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

select,button{
padding:12px;
border-radius:8px;
margin-top:10px;
}

button{
background:#003b95;
color:white;
border:none;
cursor:pointer;
}
</style>
</head>
<body>

<div class="panel">

<h1>Dashboard Carrefour — Darwin</h1>

<input type="file" id="rayonPdf" accept="application/pdf">

<br><br>

<button onclick="generateDashboard()">
Générer Dashboard
</button>

</div>

<div class="panel">

<h2>Filtrer les rayons</h2>

<select id="rayonFilter" onchange="filterRayons()">
<option value="all">Tous les rayons</option>
</select>

</div>

<div class="panel">

<h2>Top Rayons</h2>

<table>

<thead>
<tr>
<th>Rayon</th>
<th>CA</th>
<th>Evolution</th>
<th>Rang</th>
</tr>
</thead>

<tbody id="rayonTable"></tbody>

</table>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

window.ALL_RAYONS = [];

async function readPdf(file){

const buffer = await file.arrayBuffer();

const pdf = await pdfjsLib.getDocument({
data:buffer
}).promise;

let text = '';

for(let i=1;i<=pdf.numPages;i++){

const page = await pdf.getPage(i);

const content = await page.getTextContent();

text += content.items.map(item => item.str).join(' ');

}

return text;

}

function renderRayons(rayons){

const tbody = document.getElementById('rayonTable');

tbody.innerHTML = '';

rayons.forEach(r => {

tbody.innerHTML += `
<tr>
<td>${r.nom}</td>
<td>${r.ca}</td>
<td>${r.evolution}%</td>
<td>${r.rang}</td>
</tr>
`;

});

}

function populateRayonFilter(rayons){

const select = document.getElementById('rayonFilter');

select.innerHTML =
'<option value="all">Tous les rayons</option>';

rayons.forEach(r => {

const option = document.createElement('option');

option.value = r.nom;
option.textContent = r.nom;

select.appendChild(option);

});

}

function filterRayons(){

const value =
document.getElementById('rayonFilter').value;

if(value === 'all'){

renderRayons(window.ALL_RAYONS);
return;

}

const filtered =
window.ALL_RAYONS.filter(r => r.nom === value);

renderRayons(filtered);

}

function parseRayons(){

return [

{
nom:'PGC',
ca:120,
evolution:4.2,
rang:3
},

{
nom:'FRAIS',
ca:98,
evolution:-2.1,
rang:7
},

{
nom:'TEXTILE',
ca:45,
evolution:6.8,
rang:2
},

{
nom:'BAZAR',
ca:71,
evolution:1.5,
rang:5
}

];

}

async function generateDashboard(){

const file =
document.getElementById('rayonPdf').files[0];

if(!file){

alert('Veuillez charger un PDF');

return;

}

await readPdf(file);

const rayons = parseRayons();

window.ALL_RAYONS = rayons;

populateRayonFilter(rayons);

renderRayons(rayons);

}

</script>

</body>
</html>
