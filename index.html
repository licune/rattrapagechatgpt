<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brief Journalier Carrefour</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-slate-100 min-h-screen p-6">

<div class="max-w-7xl mx-auto bg-white rounded-3xl shadow-xl p-8">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-5xl font-black">Brief Journalier Carrefour</h1>
      <p class="text-slate-500 mt-2">Narbonne - Journée du 14/05/2026</p>
    </div>

    <div class="flex gap-3">
      <input type="file" id="pdfInput" accept="application/pdf" class="hidden">

      <button onclick="openPdfSelector()"
        class="px-5 py-3 rounded-2xl border border-slate-300 bg-white font-semibold">
        Import PDF
      </button>

      <button onclick="generatePDF()"
        class="bg-emerald-600 text-white px-5 py-3 rounded-2xl font-bold">
        Générer le brief
      </button>

      <button onclick="printBrief()"
        class="bg-black text-white px-5 py-3 rounded-2xl font-bold">
        Imprimer
      </button>
    </div>
  </div>

  <div id="printable-brief" class="mt-8">

    <div class="grid grid-cols-2 gap-4">

      <div class="bg-slate-50 rounded-2xl p-5">
        <p class="text-slate-500">CA</p>
        <h2 class="text-3xl font-black">335 K€</h2>
      </div>

      <div class="bg-slate-50 rounded-2xl p-5">
        <p class="text-slate-500">Marge</p>
        <h2 class="text-3xl font-black">28,44%</h2>
      </div>

      <div class="bg-slate-50 rounded-2xl p-5">
        <p class="text-slate-500">Stocks négatifs</p>
        <h2 class="text-3xl font-black">32</h2>
      </div>

      <div class="bg-slate-50 rounded-2xl p-5">
        <p class="text-slate-500">Ruptures catalogue</p>
        <h2 class="text-3xl font-black">17</h2>
      </div>

    </div>

    <div class="mt-6 bg-slate-50 rounded-2xl p-6">
      <h2 class="text-2xl font-black mb-4">Consignes</h2>

      <ul class="space-y-3">
        <li>• Contrôler les ruptures fortes rotations</li>
        <li>• Vérifier la propreté des TG</li>
        <li>• Contrôler les DLC</li>
      </ul>
    </div>

  </div>
</div>

<script>

function openPdfSelector() {
  document.getElementById('pdfInput').click();
}

document.getElementById('pdfInput')
.addEventListener('change', function(e) {

  const file = e.target.files[0];

  if (!file) return;

  alert('PDF chargé : ' + file.name);
});

function printBrief() {
  setTimeout(() => {
    window.print();
  }, 100);
}

async function generatePDF() {

  try {

    const { jsPDF } = window.jspdf;

    const element = document.getElementById('printable-brief');

    const canvas = await html2canvas(element, {
      scale: 2
    });

    const imgData = canvas.toDataURL('image/png');

    const pdf = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4'
    });

    const pdfWidth = pdf.internal.pageSize.getWidth();

    const pdfHeight =
      (canvas.height * pdfWidth) / canvas.width;

    pdf.addImage(
      imgData,
      'PNG',
      0,
      0,
      pdfWidth,
      pdfHeight
    );

    pdf.save('brief-journalier.pdf');

  } catch(error) {

    console.error(error);

    alert('Erreur génération PDF');
  }
}

</script>

</body>
</html>
