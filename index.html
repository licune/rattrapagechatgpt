
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Rayons Carrefour</title>

<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-slate-100">

<div id="root"></div>

<script type="text/babel">

const { useState } = React;

function App() {

  const rayons = [
    "Tous les rayons",
    "10 - BOISSONS",
    "11 - DROGUERIE",
    "12 - PARFUMERIE HYGIENE",
    "14 - EPICERIE",
    "19 - PARAPHARMACIE",
    "20 - CHARCUT.TRAITEUR",
    "21 - POISSONNERIE",
    "22 - FRUITS ET LEGUMES",
    "23 - BOULANGERIE/PATISSERIE",
    "24 - BOUCHERIE VOLAILLE",
    "25 - P.L.S.",
    "26 - CAFETERIA ESPACE RESTA",
    "30 - BRICOLAGE",
    "31 - CONFORT DE LA MAISON",
    "32 - PAPETERIE",
    "33 - JOUET SPORT",
    "34 - JARDIN ET ANIMALERIE",
    "35 - AUTO",
    "40 - GEM",
    "41 - PEM",
    "42 - PHOTO COMMUNICATION",
    "43 - IMAGE ET SON",
    "44 - MICRO INFORMATIQUE",
    "45 - RADIOTELEPHONIE",
    "60 - CHAUSSURE",
    "61 - BEBE",
    "62 - ENFANT",
    "63 - FEMME",
    "64 - HOMME",
    "65 - LINGE DE MAISON",
    "66 - ACCESSOIRES",
    "67 - BIJOUTERIE"
  ];

  const [selectedRayon, setSelectedRayon] = useState(rayons[0]);

  return (
    <div className="max-w-4xl mx-auto p-10">

      <div className="bg-white rounded-3xl shadow-xl p-8">

        <h1 className="text-4xl font-black mb-6">
          Brief Journalier Carrefour
        </h1>

        <select
          value={selectedRayon}
          onChange={(e) => setSelectedRayon(e.target.value)}
          className="w-full border border-slate-300 rounded-2xl p-4 text-lg"
        >
          {rayons.map((rayon, index) => (
            <option key={index} value={rayon}>
              {rayon}
            </option>
          ))}
        </select>

        <div className="mt-8 bg-slate-100 rounded-2xl p-6">
          <p className="text-xl font-bold">
            Rayon sélectionné :
          </p>

          <p className="text-2xl mt-2 text-blue-700">
            {selectedRayon}
          </p>
        </div>

      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
